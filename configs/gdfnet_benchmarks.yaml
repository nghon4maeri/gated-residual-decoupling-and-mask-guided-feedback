# Declarative Configuration for GDF-Net Training, Weight Soup, Ensemble Distillation, and Bi-ALT
# Covers ISIC-2018 (384x384), CVC-ClinicDB (384x384), Kvasir-SEG (384x384), DSB-2018 (256x256),
# and Extended Benchmarks (ISBI-2012 EM-Dataset 512x512, CHASE-DB1 512x512, DRIVE 576x576).

model:
  name: "GDFNet"
  backbone: "convformer_s18.sail_in22k_ft_in1k_384"
  params_total: 29503181
  state_dict_keys: 534
  decoder_channels: 64
  drop_path_rate: 0.2

teachers_isic2018:
  M1_canonical_base:
    init: "ImageNet-22K/1K ConvFormer-S18"
    loss: "GDFNetCompositeLoss (StructureLoss[k=31, w=5.0] + 0.5 SoftMacroDice, DS weights=[1, 1, 0.5, 0.3, 0.2])"
    lr_backbone: 1.0e-4
    lr_head: 3.0e-4
    weight_decay: 2.0e-4
    scheduler: "CosineAnnealingWarmRestarts(T_0=50, T_mult=2, eta_min=1e-6)"
    ema_decay: 0.999
    epochs: 300
  M2_multiscale_llrd:
    init: "ImageNet-22K/1K ConvFormer-S18"
    loss: "GDFNetCompositeLoss + multi-scale training ({352, 384, 448})"
    lr_backbone_stages: [1.5e-5, 2.5e-5, 4.0e-5, 6.0e-5]
    lr_head: 2.0e-4
    ema_decay: 0.998
    epochs: 60
  M3_feedback_modulated:
    architecture: "FeedbackGDFNet (2-pass spatial feedback modulator)"
    loss: "GDFNetCompositeLoss"
    note: "trained inside the distillation pipeline; see scripts/train_distill_realtime.py"
  M4_asymmetric_focal_tversky:
    init: "M1"
    loss: "AsymmetricFocalTverskyLoss (alpha_FP=0.30, beta_FN=0.70, gamma=4/3, edge_weight=4.0, tversky_weight=1.2)"
    lr_backbone_stages: [5.0e-6, 1.0e-5, 2.0e-5, 3.5e-5]
    lr_head: 6.0e-5
    ema_decay: 0.995
    epochs: 20

weight_soup:
  formula: "theta_Soup = 0.70 * theta_M1 + 0.30 * theta_M4"
  gem_ms_tta:
    views: 8
    scales: [1.0, 1.15, 0.85]
    gem_p_isic: 1.75
    gem_p_multidataset: 1.50

knowledge_distillation:
  init_checkpoint: "theta_Soup"
  ema_decay: 0.996
  temperature: 2.0
  kd_weight: 0.55
  gt_weight: 0.45
  isic2018_epochs: 15
  isic2018_lr: 4.5e-5
  multidataset_epochs: 35
  multidataset_lr: 4.0e-5

bi_alt:
  probes_anchored_at_074: [0.35, 0.50, 0.75]
  diffuse_branch:
    rho_min: 1.65
    area_mid_min: 0.45
    step_offset: 0.18
    floor: 0.45
  transitional_branch:
    rho_min: 1.32
    area_mid_min: 0.28
    step_offset: 0.06
    floor: 0.50
  crisp_branch:
    ceiling: 0.94
